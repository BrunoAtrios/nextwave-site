name: Deploy to HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostgator
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare deploy payload
        run: |
          cp -f public/.htaccess dist/.htaccess || true
          cp -f public/robots.txt dist/robots.txt || true
          cp -f public/sitemap.xml dist/sitemap.xml || true
          ls -la dist

      - name: Setup SSH agent with deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via rsync over SSH
        run: |
          rsync -avz --delete \
            -e "ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=accept-new" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'README.md' \
            ./dist/ \
            ${SSH_USER}@${SSH_HOST}:${SSH_REMOTE_DIR}/
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_REMOTE_DIR: ${{ secrets.SSH_REMOTE_DIR }}

      - name: Deployment summary
        if: success()
        run: |
          echo "✅ Deploy concluído em https://www.nextw.com.br"
          echo "📅 $(date -u)"

      - name: Deployment failed
        if: failure()
        run: |
          echo "❌ Deploy falhou — verifique os logs acima"