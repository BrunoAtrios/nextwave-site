name: Build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Validate dist
        run: |
          test -f dist/index.html || (echo "index.html missing" && exit 1)
          test -f dist/.htaccess || (echo ".htaccess missing" && exit 1)
          test -f dist/robots.txt || (echo "robots.txt missing" && exit 1)
          test -f dist/sitemap.xml || (echo "sitemap.xml missing" && exit 1)
          echo "✅ Build artifacts OK"
          du -sh dist/