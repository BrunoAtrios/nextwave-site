    <style>
      /* Splash inline para evitar FOUC e melhorar perceived performance */
      html { background: #0a0a0f; }
      body { margin: 0; background: #0a0a0f; color: #f8fafc; font-family: Inter, system-ui, sans-serif; }
      #splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #0a0a0f; z-index: 100000; transition: opacity 0.4s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #22d3ee);
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.6);
        animation: splash-pulse 1.2s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(0.8); opacity: 0.7; }
        50% { transform: scale(1.2); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><div class="dot"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener("load", function () {
        var s = document.getElementById("splash");
        if (s) {
          setTimeout(function () {
            s.classList.add("hide");
            setTimeout(function () { s.remove(); }, 500);
          }, 200);
        }
      });
    </script>
  </body>
